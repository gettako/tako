      operationId: listBackupSnapshots
      tags:
      - Backups
      responses:
        '200':
          description: List of backup records
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/backups/snapshot:
    post:
      summary: Trigger immediate backup snapshot
      description: Performs an atomic SQLite database vacuum backup and uploads archive to configured storage destination.
      operationId: createBackupSnapshot
      tags:
      - Backups
      responses:
        '200':
          description: Backup created
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/backups/restore:
    post:
      summary: Restore backup snapshot
      description: Restores database and volume state from a specified backup snapshot.
      operationId: restoreBackupSnapshot
      tags:
      - Backups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Operation succeeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tako_session
      description: Session cookie set after successful authentication
  parameters:
    ServerId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the server
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the project
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the service
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the deployment
    DomainParam:
      name: domain
      in: path
      required: true
      schema:
        type: string
      description: Fully qualified domain name
  responses:
    BadRequestError:
      description: Invalid request payload or parameter validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Missing or invalid authentication session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Insufficient privileges (administrator role required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Resource conflict or active dependency prevents operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SuccessResponse:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
  schemas:
    SuccessResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Resource was not found.
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
    UserRole:
      type: string
      enum:
      - admin
      - member
      example: member
    User:
      type: object
      required:
      - id
      - email
      - name
      - role
      - two_factor_enabled
      - passkeys_enabled
      - created_at
      properties:
        id:
          type: string
          example: usr_01h8x123
        email:
          type: string
          format: email
          example: dev@gettako.dev
        name:
          type: string
          example: Alex Developer
        role:
          $ref: '#/components/schemas/UserRole'
        two_factor_enabled:
          type: boolean
          example: false
        passkeys_enabled:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: '2026-09-30T10:00:00Z'
    UpdateUserRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    Invite:
      type: object
      required:
      - id
      - role
      - created_by
      - expires_at
      - created_at
      properties:
        id:
          type: string
          example: inv_01h8x123
        role:
          $ref: '#/components/schemas/UserRole'
        created_by:
          type: string
          example: usr_admin
        expires_at:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00Z'
        used_at:
          type:
          - string
          - 'null'
          format: date-time
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-09-30T10:00:00Z'
    CreateInviteRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
          default: member
    CreateInviteResponse:
      type: object
      required:
      - id
      - role
      - token
      - invite_url
      - expires_at
      - created_at
      properties:
        id:
          type: string
          example: inv_01h8x123
        role:
          $ref: '#/components/schemas/UserRole'
        token:
          type: string
          example: tako_inv_a1b2c3d4e5f6...
        invite_url:
          type: string
          example: /register?token=tako_inv_a1b2c3d4e5f6...
        expires_at:
          type: string
          format: date-time
          example: '2026-10-07T10:00:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-09-30T10:00:00Z'
    InviteValidationResponse:
      type: object
      required:
      - valid
      - role
      - cluster_name
      properties:
        valid:
          type: boolean
          example: true
        role:
          $ref: '#/components/schemas/UserRole'
        cluster_name:
          type: string
          example: Tako
    AcceptInviteRequest:
      type: object
      required:
      - token
      - name
      - email
      - password
      properties:
        token:
          type: string
          example: tako_inv_a1b2c3d4e5f6...
        name:
          type: string
          example: Jordan Lee
        email:
          type: string
          format: email
          example: jordan@company.com
        password:
          type: string
          format: password
          example: supersafepassword123
    AdminUser:
      type: object
      required:
      - id
      - email
      - name
      - role
      - two_factor_enabled
      - passkeys_enabled
      - created_at
      properties:
        id:
          type: string
          example: usr_admin
        email:
          type: string
          format: email
          example: admin@gettako.dev
        name:
          type: string
          example: Admin Owner
        role:
          $ref: '#/components/schemas/UserRole'
          default: admin
        two_factor_enabled:
          type: boolean
          example: false
        passkeys_enabled:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: '2026-09-28T12:00:00Z'
    UpdateProfileRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: admin@gettako.dev
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          example: current_secret_pwd
        new_password:
          type: string
          minLength: 8
          example: new_secure_pwd_123
    LoginRequest:
      type: object
      required:
      - password
      properties:
        email:
          type: string
          format: email
          example: admin@gettako.dev
        password:
          type: string
          format: password
          example: supersecretmasterpassword
        two_factor_code:
          type:
          - string
          - 'null'
          example: '123456'
    LoginResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        requires_2fa:
          type:
          - boolean
          - 'null'
          example: false
        session_id:
          type:
          - string
          - 'null'
