    AuditLogEntry:
      type: object
      required:
      - id
      - actor
      - action
      - created_at
      properties:
        id:
          type: string
          description: Unique ULID identifier of the audit log entry.
          example: 01HZX8N8V7QY6XW3T1ABCDEF01
        actor:
          type: string
          description: Identity of the user or system actor that performed the action.
          example: usr_01HZX8N8V7QY6XW3
        action:
          type: string
          description: Event action identifier (e.g. 'service.deploy', 'project.create', 'server.delete', 'env.update').
          example: service.deploy
        resource_id:
          type:
          - string
          - 'null'
          description: Identifier of the target resource.
          example: srv_01h8x123
        resource_type:
          type:
          - string
          - 'null'
          description: Category of the resource affected.
          example: service
        metadata:
          type:
          - string
          - 'null'
          description: Optional JSON-encoded string containing action-specific non-sensitive metadata.
          example: '{"branch":"main","commit_sha":"a1b2c3d"}'
        ip_address:
          type:
          - string
          - 'null'
          description: Client IP address from which the request originated.
          example: 203.0.113.195
        created_at:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp when the action occurred.
          example: '2026-09-30T10:15:30Z'
    AuditLogListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor string to pass to the 'before' query parameter for the next page. Null if no older entries
            exist.
    ConsoleDomainConfig:
      type: object
      required:
      - domain
      - ssl_provider
      - force_https
      - ssl_status
      properties:
        domain:
          type: string
          description: Active domain name or IP used to access the Tako control plane console.
          example: tako.mycompany.com
        ssl_provider:
          type: string
          enum:
          - letsencrypt
          - none
          - custom
          description: SSL certificate automation mode.
          example: letsencrypt
        force_https:
          type: boolean
          description: Whether HTTP traffic is automatically redirected to HTTPS.
          example: true
        ssl_status:
          type: string
          enum:
          - active
          - pending
          - error
          description: Current SSL certificate issuance or validation status.
          example: active
        ssl_error:
          type:
          - string
          - 'null'
          description: Detailed diagnostic message if SSL issuance or verification failed.
          example: null
        custom_cert:
          type:
          - string
          - 'null'
          description: Custom public SSL certificate in PEM format (masked in responses).
        custom_key:
          type:
          - string
          - 'null'
          description: Custom private key in PEM format (masked in responses).
        updated_at:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp of last domain configuration update.
          example: '2026-09-30T10:15:30Z'
    UpdateConsoleDomainRequest:
      type: object
      required:
      - domain
      properties:
        domain:
          type: string
          description: Fully qualified domain name or IP address for the Tako control plane.
          example: tako.mycompany.com
        ssl_provider:
          type: string
          enum:
          - letsencrypt
          - none
          - custom
          default: letsencrypt
          description: Desired SSL certificate mode.
        force_https:
          type: boolean
          default: true
          description: Redirect all HTTP (port 80) traffic to HTTPS (port 443).
        custom_cert:
          type: string
          description: PEM-encoded custom SSL certificate chain when ssl_provider is custom.
        custom_key:
          type: string
          description: PEM-encoded private key when ssl_provider is custom.
    VerifyConsoleDomainRequest:
      type: object
      required:
      - domain
      properties:
        domain:
          type: string
          description: Target domain to test DNS resolution against the host server IP.
          example: tako.mycompany.com
    VerifyConsoleDomainResponse:
      type: object
      required:
      - matches
      - domain
      - expected_ip
      - resolved_ips
      properties:
        matches:
          type: boolean
          description: True if the domain's resolved IP matches the Tako server's public IP address.
          example: true
        domain:
          type: string
          description: The queried domain name.
          example: tako.mycompany.com
        expected_ip:
          type: string
          description: The detected public IP of the Tako server.
          example: 203.0.113.195
        resolved_ips:
          type: array
          items:
            type: string
          description: IP addresses returned by public DNS resolution.
          example:
          - 203.0.113.195
        error_message:
          type:
          - string
          - 'null'
          description: Diagnostic failure explanation if resolution failed or mismatched.
          example: null
