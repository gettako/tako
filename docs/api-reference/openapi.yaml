openapi: 3.1.0
info:
  title: Tako Control Plane API
  version: 1.0.0
  description: API specification for Tako, a self-hosted application deployment platform.
  license:
    name: MIT
    identifier: MIT
servers:
- url: /
  description: Tako Control Plane Host
- url: https://api.gettako.dev
  description: Production API
security:
- cookieAuth: []
paths:
  /health:
    get:
      summary: Health check
      description: Evaluates the health and connectivity of the Tako Master Server and its embedded SQLite database.
      operationId: getHealth
      tags:
      - System
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                required:
                - status
                - database
        '503':
          description: Database or service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  database:
                    type: string
                    example: disconnected
  /api/v1/ping:
    get:
      summary: Ping API
      description: Returns pong message to verify that API router is responding.
      operationId: ping
      tags:
      - System
      security: []
      responses:
        '200':
          description: Ping response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
                required:
                - message
  /api/v1/nodes:
    get:
      summary: List nodes
      description: Lists all managed nodes with their current status, agent versions, and resource utilization.
      operationId: listNodes
      tags:
      - Nodes
      responses:
        '200':
          description: List of managed servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/nodes/enroll-token:
    post:
      summary: Generate node enrollment token
      description: Generates a cryptographically random one-time token for attaching a new worker node.
      operationId: createNodeEnrollToken
      tags:
      - Nodes
      responses:
        '200':
          description: Enrollment token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: ab12cd34ef56
                required:
                - token
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/nodes/{id}:
    get:
      summary: Get node detail
      description: Retrieves detailed specification, active container count, and agent health telemetry for a server.
      operationId: getNode
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detailed server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update node specification
      description: Updates operational configuration for a server node such as maximum concurrent deployment builds.
      operationId: updateNode
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Server updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Unregister node
      description: Unregisters a server node. Rejects deletion if services are currently assigned to this node.
      operationId: deleteNode
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Server successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/nodes/{id}/reboot:
    post:
      summary: Reboot worker node host
      description: Dispatches a host reboot instruction to the node agent daemon.
      operationId: rebootNode
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation succeeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/nodes/{id}/traefik:
    get:
      summary: Get node Traefik configuration
      description: Returns current dynamic Traefik v3 YAML configuration and certificates config for the specified node.
      operationId: getNodeTraefikConfig
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Traefik configuration content
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update node Traefik configuration
      description: Updates the dynamic Traefik v3 configuration file on the specified node.
      operationId: updateNodeTraefikConfig
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: string
              required:
              - config
      responses:
        '200':
          description: Operation succeeded
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/nodes/{id}/traefik/reload:
    post:
      summary: Reload node Traefik proxy
      description: Triggers dynamic configuration reload on the node Traefik instance.
      operationId: reloadNodeTraefik
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation succeeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/nodes/{id}/traefik/files:
    get:
      summary: List Traefik configuration files on node
      description: Enumerates all custom Traefik dynamic configuration snippets stored on the node host.
      operationId: listNodeTraefikFiles
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of Traefik config files
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    size:
                      type: integer
                    modified:
                      type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/nodes/{id}/traefik/files/{filename}:
    get:
      summary: Get specific Traefik config file
      description: Reads raw contents of a specific Traefik configuration file from the node.
      operationId: getNodeTraefikFile
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File contents
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Write specific Traefik config file
      description: Atomically writes or overwrites a Traefik dynamic configuration file on the node.
      operationId: saveNodeTraefikFile
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Operation succeeded
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      summary: Delete Traefik config file
      description: Removes a custom Traefik configuration file from the node filesystem.
      operationId: deleteNodeTraefikFile
      tags:
      - Nodes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation succeeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/events/nodes:
    get:
      summary: Node real-time SSE event stream
      description: Streams real-time Server-Sent Events containing node connectivity, heartbeats, and resource telemetry.
      operationId: streamNodeEvents
      tags:
      - Events
      responses:
        '200':
          description: SSE text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/services:
    get:
      summary: List services
      description: Retrieves services with optional filtering by project or host server.
      operationId: listServices
      tags:
      - Services
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          type: string
        description: Filter services by project ID
      - name: server_id
        in: query
        required: false
        schema:
          type: string
        description: Filter services by server ID
      - name: parent_service_id
        in: query
        required: false
        schema:
          type: string
        description: Filter services by parent service ID
      responses:
        '200':
          description: Filtered list of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create service
      description: Configures and provisions a new service assigned to a specific server and project.
      operationId: createService
      tags:
      - Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/services/{id}:
    get:
      summary: Service detail
      description: Returns configuration, runtime status, active deployment, and attached domains for a service.
      operationId: getService
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Service detail configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update service
      description: Updates service configuration such as branch, Dockerfile path, port, or target server.
      operationId: updateService
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Updated service object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete service
      description: Gracefully stops containers, removes reverse proxy configurations, and removes the service.
      operationId: deleteService
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Service deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/services/{id}/domains:
    get:
      summary: List service domains
      description: Returns all custom domains routed to this service with Let's Encrypt SSL certificate status.
      operationId: listServiceDomains
      tags:
      - Domains
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of domains and SSL status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Add custom domain
      description: Attaches a custom domain name and container port mapping to the Traefik router.
      operationId: addServiceDomain
      tags:
      - Domains
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainRequest'
      responses:
        '201':
          description: Domain added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/services/{id}/domains/{domainId}:
    delete:
      summary: Remove custom domain
      description: Removes custom domain routing from the service and deprovisions TLS certificates.
      operationId: deleteServiceDomain
      tags:
      - Domains
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: domainId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation succeeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/services/{id}/domains/{domainId}/primary:
    patch:
      summary: Set primary domain
      description: Designates the specified custom domain as the canonical primary domain for the service.
      operationId: setPrimaryServiceDomain
      tags:
      - Domains
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: domainId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation succeeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/services/{id}/deploy:
    post:
      summary: Trigger deployment
      description: Initiates a new build and zero-downtime deployment pipeline for the specified service.
      operationId: triggerServiceDeploy
      tags:
      - Deployments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
                commitHash:
                  type: string
      responses:
        '202':
          description: Deployment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploymentId:
                    type: string
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/services/{id}/exec:
    post:
      summary: Execute container command
      description: Runs a one-shot command inside the active service container and returns stdout/stderr.
      operationId: execServiceCommand
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                containerName:
                  type: string
              required:
              - command
      responses:
        '200':
          description: Command execution results
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string
                  stdout:
                    type: string
                  stderr:
                    type: string
                  exitCode:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/services/{id}/container-logs:
    get:
      summary: Get service runtime logs
      description: Retrieves recent stdout/stderr log output from the running service container.
      operationId: getServiceContainerLogs
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Runtime logs
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/services/{id}/env:
    get:
      summary: Get environment variables
      description: Returns runtime environment variables and build arguments. Secrets are masked by default.
      operationId: getServiceEnv
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Environment variables and build arguments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnv'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update environment variables
      description: Encrypts and saves runtime environment variables and build arguments for a service.
      operationId: updateServiceEnv
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceEnvRequest'
      responses:
        '200':
          description: Environment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnv'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/services/{id}/deployments:
    get:
      summary: List deployments for service
      description: Retrieves historical deployment runs specifically for this service.
      operationId: listServiceDeployments
      tags:
      - Deployments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of deployments
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/services/{id}/metrics:
    get:
      summary: Get service metrics
      description: Fetches historical and real-time CPU, RAM, and network metrics for this service container.
      operationId: getServiceMetrics
      tags:
      - Metrics
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resource metrics
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/services/{id}/terminal:
    get:
      summary: Interactive Web Terminal WebSocket
      description: Establishes a bi-directional WebSocket connection attaching a PTY shell session directly to the running
        container.
      operationId: connectServiceTerminal
      tags:
      - Services
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: container
        in: query
        required: false
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols to WebSocket
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/deployments:
    get:
      summary: List all deployments
      description: Lists chronological deployment events across all projects and services.
      operationId: listAllDeployments
      tags:
      - Deployments
      responses:
        '200':
          description: List of deployments
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/deployments/{id}:
    get:
      summary: Get deployment detail
      description: Retrieves deployment metadata, status, commit reference, and build duration.
      operationId: getDeploymentDetail
      tags:
      - Deployments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deployment details
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/deployments/{id}/rollback:
    post:
      summary: Rollback deployment
      description: Immediately reverts the service to the container image tag produced by this deployment.
      operationId: rollbackDeployment
      tags:
      - Deployments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation succeeded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/deployments/{id}/logs:
    get:
      summary: Stream deployment build logs
      description: Streams real-time build and deployment logs via Server-Sent Events (SSE).
      operationId: streamDeploymentLogs
      tags:
      - Deployments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/deployments/{id}/logs/history:
    get:
      summary: Get historical deployment build logs
      description: Returns the complete build and container log history for a finished deployment.
      operationId: getDeploymentLogsHistory
      tags:
      - Deployments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Historical log entries
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/projects:
    get:
      summary: List projects
      description: Retrieves all project workspaces with active service counts.
      operationId: listProjects
      tags:
      - Projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create project
      description: Creates a new project workspace container for grouping services.
      operationId: createProject
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/projects/{id}:
