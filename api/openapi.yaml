components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tako_session
      description: Session cookie set after successful authentication

  parameters:
    ServerId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the server

    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the project

    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the service

    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the deployment

    DomainParam:
      name: domain
      in: path
      required: true
      schema:
        type: string
      description: Fully qualified domain name

  responses:
    BadRequestError:
      description: Invalid request payload or parameter validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedError:
      description: Missing or invalid authentication session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ForbiddenError:
      description: Insufficient privileges (administrator role required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
