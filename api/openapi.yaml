        - $ref: '#/components/parameters/ServiceId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Items per page
      responses:
        '200':
          description: Paginated deployments list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Trigger manual deployment
      description: Queues a new deployment for a specific branch or commit.
      operationId: createDeployment
      tags:
        - Deployments
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '202':
          description: Deployment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/services/{id}/deployments/{deployment_id}:
    get:
      summary: Deployment detail
      description: Retrieves timing metrics, commit details, build steps, and failure reason for a deployment.
      operationId: getDeployment
      tags:
        - Deployments
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '200':
          description: Deployment detail information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/services/{id}/deployments/{deployment_id}/cancel:
    post:
      summary: Cancel deployment
      description: Aborts an in-progress deployment and terminates the remote build job.
      operationId: cancelDeployment
      tags:
        - Deployments
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '200':
          description: Deployment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/services/{id}/deployments/{deployment_id}/rollback:
    post:
      summary: Rollback to deployment
      description: Immediately points traffic to the Docker image associated with an earlier successful deployment.
      operationId: rollbackDeployment
      tags:
        - Deployments
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '202':
          description: Rollback initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Ephemeral Preview Environments
  # ---------------------------------------------------------------------------
  /api/services/{id}/previews:
    get:
      summary: List preview environments
      description: Returns active ephemeral preview environments for pull requests targeting this service.
      operationId: listServicePreviews
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: List of preview environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreviewEnvironment'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/services/{id}/previews/{preview_id}:
    delete:
      summary: Delete preview environment
      description: Tears down container, deletes proxy route, and frees resources for the ephemeral preview.
      operationId: deleteServicePreview
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: preview_id
          in: path
          required: true
          schema:
            type: string
          description: Unique preview service identifier
      responses:
        '200':
          description: Preview environment successfully deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Preview environment deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
