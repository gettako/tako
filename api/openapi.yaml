openapi: 3.1.0
info:
  title: Tako Control Plane API
  version: 1.0.0
  description: API specification for Tako, a self-hosted application deployment platform.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Current Host
security:
  - cookieAuth: []
paths:
  # ---------------------------------------------------------------------------
  # Authentication & Profile
  # ---------------------------------------------------------------------------
  /api/auth/login:
    post:
      summary: Password login
      description: Validates administrator password and checks whether two-factor authentication is required.
      operationId: login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful or 2FA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/logout:
    post:
      summary: Terminate session
      description: Invalidates active session and clears session cookies.
      operationId: logout
      tags:
        - Auth
      responses:
        '200':
          description: Session terminated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/me:
    get:
      summary: Current session profile
      description: Retrieves the currently authenticated administrator profile and security settings.
      operationId: getCurrentUser
      tags:
        - Auth
      responses:
        '200':
          description: Profile of authenticated administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/profile:
    patch:
      summary: Update administrator profile
      description: Updates the administrator profile details such as email.
      operationId: updateProfile
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile of administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/change-password:
    post:
      summary: Change administrator password
      description: Validates current password and updates to new password.
      operationId: changePassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/2fa/setup:
    post:
      summary: Begin TOTP setup
      description: Generates a new TOTP secret, QR code SVG, and backup recovery codes.
      operationId: setupTwoFactor
      tags:
        - Auth
      responses:
        '200':
          description: TOTP setup details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/2fa/verify:
    post:
      summary: Verify and enable TOTP
      description: Confirms six-digit TOTP verification code to activate two-factor authentication.
      operationId: verifyTwoFactor
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
      responses:
        '200':
          description: Two-factor authentication enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/passkey/register/begin:
    post:
      summary: Begin passkey registration
      description: Generates WebAuthn registration options for hardware key or biometric authenticator.
      operationId: beginPasskeyRegistration
      tags:
        - Auth
      responses:
        '200':
          description: WebAuthn creation options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistrationOptions'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/passkey/register/finish:
    post:
      summary: Finish passkey registration
      description: Verifies WebAuthn attestation response and stores the registered public key.
      operationId: finishPasskeyRegistration
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationVerification'
      responses:
        '200':
          description: Passkey registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistrationResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/passkey/login/begin:
    post:
      summary: Begin passkey login
      description: Generates WebAuthn assertion challenge options for passwordless login.
      operationId: beginPasskeyLogin
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: WebAuthn assertion request options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyLoginOptions'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/auth/passkey/login/finish:
    post:
      summary: Finish passkey login
      description: Validates WebAuthn assertion response and establishes a secure session.
      operationId: finishPasskeyLogin
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginVerification'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ---------------------------------------------------------------------------
  # User Management & Collaboration
  # ---------------------------------------------------------------------------
  /api/users:
    get:
      summary: List all users
      description: Lists all active users in the cluster. Requires administrator privileges.
      operationId: listUsers
      tags:
        - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/users/{id}/role:
    patch:
      summary: Update user role
      description: Updates the role of a user between admin and member. Requires administrator privileges. Prevents self-demotion or removing the last admin.
      operationId: updateUserRole
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Target user identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: User role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/users/{id}:
    delete:
      summary: Delete user
      description: Deletes a user and purges all active sessions immediately. Requires administrator privileges. Prevents deleting self or last admin.
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Target user identifier
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/invites:
    post:
      summary: Create invitation
      description: Generates a single-use invitation token and copyable registration URL. Requires administrator privileges.
      operationId: createInvite
      tags:
        - Invites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invitation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInviteResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      summary: List pending invites
      description: Lists all pending, non-expired invitations. Requires administrator privileges.
      operationId: listInvites
      tags:
        - Invites
      responses:
        '200':
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/invites/{id}:
    delete:
      summary: Revoke invitation
      description: Revokes an active pending invitation. Requires administrator privileges.
      operationId: revokeInvite
      tags:
        - Invites
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Invitation identifier
      responses:
        '200':
          description: Invitation revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/invites/validate:
    get:
      summary: Validate invitation token
      description: Public endpoint returning invitation role and validity for the registration screen.
      operationId: validateInvite
      tags:
        - Invites
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Raw invitation token
      responses:
        '200':
          description: Invitation is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/invites/accept:
    post:
      summary: Accept invitation and register
      description: Public endpoint to register with a valid invitation token, creating the user and establishing an active session.
      operationId: acceptInvite
      tags:
        - Invites
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: User registered successfully and session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  # ---------------------------------------------------------------------------
  # Server Management
  # ---------------------------------------------------------------------------
  /api/servers:
    get:
      summary: List servers
      description: Lists all managed nodes with their current status, agent versions, and resource utilization.
      operationId: listServers
      tags:
        - Servers
      responses:
        '200':
          description: List of managed servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Add server
      description: Registers a new server node and returns a one-time enrollment token and Docker Compose snippet.
      operationId: createServer
      tags:
        - Servers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Server created with enrollment command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServerResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/servers/{id}:
    get:
      summary: Server detail
      description: Retrieves detailed specification, active container count, and agent health telemetry for a server.
      operationId: getServer
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Detailed server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update server settings
      description: Updates operational configuration for a server node such as maximum concurrent deployment builds.
      operationId: updateServer
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Server updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete server
      description: Unregisters a server node. Rejects deletion if services are currently assigned to this node.
      operationId: deleteServer
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Server successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/servers/{id}/prune:
    post:
      summary: Trigger resource cleanup
      description: Dispatches a maintenance job to the node agent to prune dangling images, old containers, and build cache.
      operationId: pruneServer
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Prune job executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruneResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/servers/{id}/traefik/config:
    get:
      summary: Get server Traefik configuration
      description: Returns the custom dynamic YAML configuration and active static configuration for the node.
      operationId: getServerTraefikConfig
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Traefik configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTraefikConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update server Traefik custom configuration
      description: Validates and updates the custom dynamic rules in /etc/traefik/dynamic/custom.yaml on the target node.
      operationId: updateServerTraefikConfig
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTraefikConfigRequest'
      responses:
        '200':
          description: Custom configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTraefikConfig'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/servers/{id}/traefik/restart:
    post:
      summary: Restart server Traefik container
      description: Restarts the Traefik proxy container on the target node to reload static configuration changes.
      operationId: restartServerTraefik
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Traefik container restart triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'


  # ---------------------------------------------------------------------------
  # Project Management
  # ---------------------------------------------------------------------------
  /api/projects:
    get:
      summary: List projects
      description: Retrieves all project workspaces with active service counts.
      operationId: listProjects
      tags:
        - Projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create project
      description: Creates a new project workspace container for grouping services.
      operationId: createProject
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/projects/{id}:
    get:
      summary: Project detail
      description: Retrieves project details alongside its associated services.
      operationId: getProject
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details and child services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update project
      description: Updates project metadata such as name and description.
      operationId: updateProject
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete project
      description: Deletes a project and terminates all child services and deployments.
      operationId: deleteProject
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project and associated services deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Service Management
  # ---------------------------------------------------------------------------
  /api/services:
    get:
      summary: List services
      description: Retrieves services with optional filtering by project or host server.
      operationId: listServices
      tags:
        - Services
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
          description: Filter services by project ID
        - name: server_id
          in: query
          required: false
          schema:
            type: string
          description: Filter services by server ID
        - name: parent_service_id
          in: query
          required: false
          schema:
            type: string
          description: Filter services by parent service ID
      responses:
        '200':
          description: Filtered list of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create service
      description: Configures and provisions a new service assigned to a specific server and project.
      operationId: createService
      tags:
        - Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/services/validate-compose:
    post:
      summary: Validate Docker Compose content
      description: Validates Docker Compose schema, services, ports, and environment variables.
      operationId: validateCompose
      tags:
        - Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateComposeRequest'
      responses:
        '200':
          description: Compose validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateComposeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/services/{id}:
    get:
      summary: Service detail
      description: Returns configuration, runtime status, active deployment, and attached domains for a service.
      operationId: getService
      tags:
        - Services
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service detail configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update service
      description: Updates service configuration such as branch, Dockerfile path, port, or target server.
      operationId: updateService
      tags:
        - Services
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Updated service object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete service
      description: Gracefully stops containers, removes reverse proxy configurations, and removes the service.
      operationId: deleteService
      tags:
        - Services
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: delete_volumes
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to permanently delete persistent host storage volumes.
        - name: prune_images
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to remove unused Docker images from host.
      responses:
        '200':
          description: Service deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

