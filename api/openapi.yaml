            type: integer
            default: 100
            minimum: 1
            maximum: 2000
          description: Number of recent log lines to replay before streaming
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Keep connection open and stream new logs
        - name: container
          in: query
          required: false
          schema:
            type: string
          description: Optional filter by specific container or sub-service name in the stack
      responses:
        '200':
          description: Real-time event stream for container output
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ContainerLogEvent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/services/{id}/status:
