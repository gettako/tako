# Dynamic routing configuration for Tako Console Dashboard
# Physical host location: /etc/tako/traefik/tako.yml
http:
  routers:
    # Terminal WebSocket PTY stream direct to backend
    tako-terminal-secure:
      rule: "PathPrefix(`/api/v1/services/`) && PathRegexp(`/api/v1/services/[^/]+/terminal`)"
      entryPoints:
        - websecure
      priority: 10
      tls:
        certResolver: letsencrypt
      service: tako-server

    tako-terminal:
      rule: "PathPrefix(`/api/v1/services/`) && PathRegexp(`/api/v1/services/[^/]+/terminal`)"
      entryPoints:
        - web
      priority: 10
      service: tako-server

    # HTTPS: Console served on websecure
    tako-console-secure:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      priority: 1
      tls:
        certResolver: letsencrypt
      service: tako-console

    # HTTP: Console served on web
    tako-console:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      priority: 1
      service: tako-console

  services:
    tako-server:
      loadBalancer:
        servers:
          - url: "http://tako-server:8080"
    tako-console:
      loadBalancer:
        servers:
          - url: "http://tako-console:3000"
