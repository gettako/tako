# Dynamic routing configuration for Tako Console Dashboard
# Physical host location: /etc/tako/traefik/tako.yml
# When no custom domain is configured in Settings -> Domain,
# console is only accessible directly via port 3000.
# Unassigned domains requesting port 80/443 will receive HTTP 404 Not Found.
http:
  services:
    tako-server:
      loadBalancer:
        servers:
          - url: "http://tako-server:8080"
    tako-console:
      loadBalancer:
        servers:
          - url: "http://tako-console:3000"

