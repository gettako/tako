# Dynamic routing configuration for Tako Console Dashboard
# Physical host location: /etc/tako/traefik/tako.yml
http:
  routers:
    # HTTPS: Console served on websecure
    tako-console-secure:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      priority: 1
      tls:
        certResolver: letsencrypt
      service: tako-console

    # HTTP: Redirect console to HTTPS
    tako-console-redirect:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      priority: 1
      middlewares:
        - tako-redirect-ssl
      service: tako-console

  middlewares:
    tako-redirect-ssl:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    tako-console:
      loadBalancer:
        servers:
          - url: "http://tako-console:3000"
