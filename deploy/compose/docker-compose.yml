services:
  traefik:
    image: traefik:v3.2
    container_name: tako-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ${TAKO_TRAEFIK_DYNAMIC_DIR:-/etc/tako/traefik/dynamic}:/etc/traefik/dynamic
      - tako_traefik_acme:/etc/traefik/acme
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${TAKO_ADMIN_EMAIL:-admin@octopy.dev}
    networks:
      - tako_network

  console:
    build:
      context: ../..
      dockerfile: console/Dockerfile
    image: ghcr.io/gettako/console:latest
    container_name: tako-console
    restart: unless-stopped
    ports:
      - "${TAKO_CONSOLE_PORT:-3000}:3000"
    environment:
      - TAKO_BACKEND_URL=http://server:8080
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_MODE=live
    networks:
      - tako_network
    depends_on:
      - server

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: ghcr.io/gettako/server:latest
    container_name: tako-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TAKO_PORT:-8080}:8080"
      - "${TAKO_GRPC_PORT:-50051}:50051"
    environment:
      - TAKO_PORT=8080
      - TAKO_GRPC_PORT=50051
      - TAKO_DOMAIN=${TAKO_DOMAIN:-localhost}
      - TAKO_DB_PATH=/etc/tako/tako.db
      - TAKO_SECRET_KEY=${TAKO_SECRET_KEY:-tako-default-super-secret-key-32b}
      - TAKO_LOCAL_ENROLLMENT_TOKEN=${TAKO_LOCAL_ENROLLMENT_TOKEN:-tako-local-bootstrap-token}
      - TAKO_CONSOLE_PORT=${TAKO_CONSOLE_PORT:-3000}
      - TAKO_TRAEFIK_DYNAMIC_DIR=/etc/traefik/dynamic
      - TAKO_GITHUB_APP_ID=${TAKO_GITHUB_APP_ID:-}
      - TAKO_GITHUB_APP_PRIVATE_KEY=${TAKO_GITHUB_APP_PRIVATE_KEY:-}
      - TAKO_GITHUB_WEBHOOK_SECRET=${TAKO_GITHUB_WEBHOOK_SECRET:-}
      - TAKO_GITHUB_PAT=${TAKO_GITHUB_PAT:-}
    volumes:
      - tako_server_data:/etc/tako
      - ${TAKO_TRAEFIK_DYNAMIC_DIR:-/etc/tako/traefik/dynamic}:/etc/traefik/dynamic
    networks:
      - tako_network

  agent:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    image: ghcr.io/gettako/agent:latest
    container_name: tako-agent
    restart: unless-stopped
    environment:
      - TAKO_SERVER_URL=http://server:50051
      - TAKO_ENROLLMENT_TOKEN=${TAKO_LOCAL_ENROLLMENT_TOKEN:-tako-local-bootstrap-token}
      - TAKO_CONFIG_DIR=/etc/tako
      - TAKO_TRAEFIK_DYNAMIC_DIR=/etc/traefik/dynamic
      - TAKO_TRAEFIK_ACME_PATH=/etc/traefik/acme/acme.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tako_agent_data:/etc/tako
      - ${TAKO_TRAEFIK_DYNAMIC_DIR:-/etc/tako/traefik/dynamic}:/etc/traefik/dynamic
      - tako_traefik_acme:/etc/traefik/acme:ro
    networks:
      - tako_network
    depends_on:
      - server

volumes:
  tako_server_data:
    name: tako_server_data
  tako_agent_data:
    name: tako_agent_data
  tako_traefik_acme:
    name: tako_traefik_acme

networks:
  tako_network:
    name: tako_network
