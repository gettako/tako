services:
  traefik:
    image: traefik:latest
    container_name: tako-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/tako/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /etc/tako/traefik/tako.yml:/etc/traefik/dynamic/tako.yml:ro
      - /etc/tako/traefik/dynamic:/etc/traefik/dynamic
      - /etc/tako/traefik/acme.json:/acme.json
    environment:
      - TAKO_ACME_EMAIL=${TAKO_ACME_EMAIL:-admin@gettako.dev}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${TAKO_ACME_EMAIL:-admin@gettako.dev}
    networks:
      - tako-network

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: ghcr.io/gettakodev/tako-server:latest
    container_name: tako-server
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "${TAKO_HTTP_BIND:-8080}:8080"
    volumes:
      - ../data/sqlite:/data
      - /etc/tako/traefik:/etc/tako/traefik
    environment:
      - TAKO_HTTP_PORT=8080
      - TAKO_GRPC_PORT=50051
      - TAKO_DB_PATH=/data/tako.db
      - TAKO_AUTH_SECRET=${TAKO_AUTH_SECRET:-tako-secret-key-change-me}
      - TAKO_INITIAL_ADMIN_EMAIL=${TAKO_EMAIL:-admin@gettako.dev}
      - TAKO_INITIAL_ADMIN_PASSWORD=${TAKO_PASSWORD:-admin123456}
      - TAKO_AGENT_SECRET=${TAKO_ENROLL_TOKEN:-local-master-token}
      - TAKO_NODE_NAME=${TAKO_NODE_NAME:-tako-master-01}
    networks:
      - tako-network

  console:
    build:
      context: ../console
      dockerfile: Dockerfile
    image: ghcr.io/gettakodev/tako-console:latest
    container_name: tako-console
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TAKO_SERVER_URL=http://tako-server:8080
      - NEXT_PUBLIC_TAKO_SERVER_URL=http://${TAKO_PUBLIC_IP:-localhost}:3000
    depends_on:
      - server
    networks:
      - tako-network

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: ghcr.io/gettakodev/tako-agent:latest
    container_name: tako-agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/os-release:/etc/os-release:ro
      - /etc/tako/traefik/dynamic:/etc/tako/traefik/dynamic
      - ../data/agent:/data
    environment:
      - TAKO_SERVER_ADDR=tako-server:50051
      - TAKO_MASTER_URL=tako-server:50051
      - TAKO_ENROLL_TOKEN=${TAKO_ENROLL_TOKEN:-local-master-token}
      - TAKO_NODE_ID=${TAKO_NODE_ID:-tako-master-01}
      - TAKO_NODE_NAME=${TAKO_NODE_NAME:-tako-master-01}
      - TAKO_NODE_ROLE=leader
      - TAKO_PUBLIC_IP=${TAKO_PUBLIC_IP:-}
      - TAKO_IP_ADDRESS=${TAKO_IP_ADDRESS:-${TAKO_PRIVATE_IP:-127.0.0.1}}
      - TAKO_STATE_FILE=/data/agent.json
      - TAKO_METRICS_INTERVAL=3s
      - TAKO_TRAEFIK_DYNAMIC_DIR=/etc/tako/traefik/dynamic
    depends_on:
      - server
    networks:
      - tako-network

networks:
  tako-network:
    name: tako-network
    external: true
