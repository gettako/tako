services:
  traefik:
    image: traefik:v3.1
    container_name: tako-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    environment:
      - TAKO_ACME_EMAIL=${TAKO_ACME_EMAIL:-admin@gettako.dev}
    networks:
      - tako-network

  agent:
    image: ghcr.io/gettakodev/tako-agent:latest
    container_name: tako-agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data/agent:/data
    environment:
      - TAKO_SERVER_ADDR=${TAKO_MASTER_URL:-127.0.0.1:50051}
      - TAKO_ENROLL_TOKEN=${TAKO_AGENT_TOKEN}
      - TAKO_NODE_NAME=${TAKO_NODE_NAME}
      - TAKO_METRICS_INTERVAL=3s
    networks:
      - tako-network

networks:
  tako-network:
    name: tako-network
    driver: bridge
    attachable: true
